<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">HSE safety poster: safety is designed too</title><desc id="desc">High-contrast internal communication poster with a three-step operational checklist.</desc><rect width="1200" height="1500" fill="#0b1724"/><path d="M0 0h1200v390c-300 50-530-75-1200 150Z" fill="#123441"/><circle cx="1000" cy="170" r="112" fill="#f5a623"/><g font-family="Arial,sans-serif"><text x="86" y="112" fill="#1fb7a6" font-family="monospace" font-size="24" letter-spacing="5">HSE / OPERATIONAL CULTURE</text><text x="86" y="330" fill="#fffdf8" font-size="100" font-weight="700">Safety is</text><text x="86" y="440" fill="#fffdf8" font-size="100" font-weight="700">designed</text><text x="86" y="550" fill="#1fb7a6" font-size="100" font-weight="700">too.</text><text x="86" y="632" fill="#a7c1c4" font-size="26">A clear signal can change a decision.</text><g transform="translate(86 790)"><rect width="1028" height="420" fill="#fffdf8"/><text x="42" y="74" fill="#0b1724" font-size="20" letter-spacing="3">BEFORE YOU START</text><path d="M42 116h944" stroke="#d9d4c9" stroke-width="2"/><g fill="#0b1724" font-size="30"><text x="42" y="188">01</text><text x="160" y="188" font-weight="700">Observe the area.</text><text x="42" y="278">02</text><text x="160" y="278" font-weight="700">Confirm the control.</text><text x="42" y="368">03</text><text x="160" y="368" font-weight="700">Communicate the change.</text></g><g fill="#1fb7a6"><circle cx="956" cy="180" r="17"/><circle cx="956" cy="270" r="17"/><circle cx="956" cy="360" r="17"/></g></g><text x="86" y="1345" fill="#f5a623" font-size="22" letter-spacing="3">STOP / THINK / ACT</text><text x="86" y="1405" fill="#fffdf8" font-size="30" font-weight="700">Continuity starts with people.</text></g></svg>
