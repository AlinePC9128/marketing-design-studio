<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Cartel HSE: la seguridad también se diseña</title><desc id="desc">Cartel de comunicación interna con lista de verificación operativa.</desc><rect width="1200" height="1500" fill="#1a1230"/><path d="M0 0h1200v390c-300 50-530-75-1200 150Z" fill="#7046ff"/><circle cx="1000" cy="170" r="112" fill="#ffcb3d"/><g font-family="Arial,sans-serif"><text x="86" y="112" fill="#00bfae" font-family="monospace" font-size="24" letter-spacing="5">HSE / CULTURA OPERATIVA</text><text x="86" y="330" fill="#fffdfb" font-size="100" font-weight="700">La seguridad</text><text x="86" y="440" fill="#fffdfb" font-size="100" font-weight="700">también se</text><text x="86" y="550" fill="#ff5b70" font-size="100" font-weight="700">diseña.</text><text x="86" y="632" fill="#e5d9ef" font-size="26">Una señal clara puede cambiar una decisión.</text><g transform="translate(86 790)"><rect width="1028" height="420" fill="#fffdfb"/><text x="42" y="74" fill="#1a1230" font-size="20" letter-spacing="3">ANTES DE EMPEZAR</text><path d="M42 116h944" stroke="#ead9e5" stroke-width="2"/><g fill="#1a1230" font-size="30"><text x="42" y="188">01</text><text x="160" y="188" font-weight="700">Observa el área.</text><text x="42" y="278">02</text><text x="160" y="278" font-weight="700">Confirma el control.</text><text x="42" y="368">03</text><text x="160" y="368" font-weight="700">Comunica el cambio.</text></g><g fill="#00bfae"><circle cx="956" cy="180" r="17"/><circle cx="956" cy="270" r="17"/><circle cx="956" cy="360" r="17"/></g></g><text x="86" y="1345" fill="#ffcb3d" font-size="22" letter-spacing="3">DETENTE / PIENSA / ACTÚA</text><text x="86" y="1405" fill="#fffdfb" font-size="30" font-weight="700">La continuidad empieza con las personas.</text></g></svg>
