<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">UX and web design wireframe process</title>
  <desc id="desc">Wireframe board showing a user flow, responsive layouts and a conversion-focused landing page.</desc>
  <rect width="1200" height="900" fill="#e9f0ef"/>
  <g font-family="Arial,sans-serif"><text x="70" y="85" fill="#1fb7a6" font-family="monospace" font-size="18" letter-spacing="4">UX/UI + WEB / FROM FLOW TO INTERFACE</text><text x="70" y="185" fill="#0b1724" font-size="70" font-weight="700">Make the next step</text><text x="70" y="260" fill="#f5a623" font-size="70" font-weight="700">obvious.</text><text x="72" y="315" fill="#5f6c76" font-size="20">Information architecture, wireframes, responsive UI and</text><text x="72" y="345" fill="#5f6c76" font-size="20">conversion paths for practical digital experiences.</text>
    <g transform="translate(72 450)"><rect width="270" height="290" fill="#fff" stroke="#b8ceca"/><text x="28" y="48" fill="#1fb7a6" font-family="monospace" font-size="14">01 / USER FLOW</text><circle cx="60" cy="110" r="22" fill="#0b1724"/><rect x="103" y="91" width="126" height="38" rx="19" fill="#1fb7a6"/><circle cx="60" cy="190" r="22" fill="#f5a623"/><rect x="103" y="171" width="126" height="38" rx="19" fill="#0b1724"/><path d="M60 132v36" stroke="#5f6c76" stroke-width="3"/><text x="24" y="255" fill="#5f6c76" font-size="16">Goal → evidence → action</text></g>
    <g transform="translate(380 450)"><rect width="270" height="290" fill="#fff" stroke="#b8ceca"/><text x="28" y="48" fill="#1fb7a6" font-family="monospace" font-size="14">02 / WIREFRAME</text><rect x="28" y="80" width="214" height="130" fill="#e9f0ef"/><rect x="45" y="98" width="76" height="12" fill="#0b1724"/><rect x="45" y="126" width="170" height="7" fill="#b8ceca"/><rect x="45" y="143" width="135" height="7" fill="#b8ceca"/><rect x="45" y="173" width="90" height="20" rx="10" fill="#1fb7a6"/><text x="28" y="255" fill="#5f6c76" font-size="16">Hierarchy before styling</text></g>
    <g transform="translate(688 450)"><rect width="420" height="290" fill="#0b1724"/><text x="28" y="48" fill="#1fb7a6" font-family="monospace" font-size="14">03 / RESPONSIVE UI</text><rect x="28" y="80" width="364" height="118" fill="#f4f0e8"/><rect x="52" y="101" width="150" height="12" fill="#0b1724"/><rect x="52" y="130" width="240" height="8" fill="#a7b5b7"/><rect x="52" y="149" width="110" height="22" rx="11" fill="#f5a623"/><text x="28" y="252" fill="#fff" font-size="16">Mobile-first / accessible / measurable</text></g>
  </g>
</svg>
