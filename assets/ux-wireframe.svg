<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Proceso de UX y diseño web</title><desc id="desc">Tablero con user flow, wireframe, prototipo y layout responsive.</desc><rect width="1200" height="900" fill="#e8fff8"/><g font-family="Arial,sans-serif"><text x="70" y="85" fill="#7046ff" font-family="monospace" font-size="18" letter-spacing="4">UX/UI + WEB / DEL FLUJO A LA INTERFAZ</text><text x="70" y="185" fill="#1a1230" font-size="70" font-weight="700">Hacer evidente</text><text x="70" y="260" fill="#ff5b70" font-size="70" font-weight="700">el siguiente paso.</text><text x="72" y="315" fill="#6e6576" font-size="20">Arquitectura de información, wireframes, interfaces responsive</text><text x="72" y="345" fill="#6e6576" font-size="20">y rutas de conversión para experiencias prácticas.</text><g transform="translate(72 450)"><rect width="270" height="290" fill="#fffdfb" stroke="#b8ded3"/><text x="28" y="48" fill="#7046ff" font-family="monospace" font-size="14">01 / USER FLOW</text><circle cx="60" cy="110" r="22" fill="#7046ff"/><rect x="103" y="91" width="126" height="38" rx="19" fill="#ff5b70"/><circle cx="60" cy="190" r="22" fill="#ffcb3d"/><rect x="103" y="171" width="126" height="38" rx="19" fill="#1a1230"/><path d="M60 132v36" stroke="#6e6576" stroke-width="3"/><text x="24" y="255" fill="#6e6576" font-size="16">Objetivo → evidencia → acción</text></g><g transform="translate(380 450)"><rect width="270" height="290" fill="#fffdfb" stroke="#b8ded3"/><text x="28" y="48" fill="#7046ff" font-family="monospace" font-size="14">02 / WIREFRAME</text><rect x="28" y="80" width="214" height="130" fill="#e8fff8"/><rect x="45" y="98" width="76" height="12" fill="#1a1230"/><rect x="45" y="126" width="170" height="7" fill="#b8ded3"/><rect x="45" y="143" width="135" height="7" fill="#b8ded3"/><rect x="45" y="173" width="90" height="20" rx="10" fill="#00bfae"/><text x="28" y="255" fill="#6e6576" font-size="16">Jerarquía antes que estilo</text></g><g transform="translate(688 450)"><rect width="420" height="290" fill="#7046ff"/><text x="28" y="48" fill="#ffcb3d" font-family="monospace" font-size="14">03 / UI RESPONSIVE</text><rect x="28" y="80" width="364" height="118" fill="#fff1e8"/><rect x="52" y="101" width="150" height="12" fill="#1a1230"/><rect x="52" y="130" width="240" height="8" fill="#c2b6c8"/><rect x="52" y="149" width="110" height="22" rx="11" fill="#ff5b70"/><text x="28" y="252" fill="#fffdfb" font-size="16">Mobile-first / accesible / medible</text></g></g></svg>
