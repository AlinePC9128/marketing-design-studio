<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Tablero de identidad personal de Aline Peña Colunga</title><desc id="desc">Tablero visual con monograma, tipografía, paleta y principios de diseño.</desc><rect width="1200" height="900" fill="#fff1e8"/><rect width="1200" height="18" fill="#ff5b70"/><g font-family="Arial,sans-serif"><text x="70" y="90" fill="#7046ff" font-family="monospace" font-size="18" letter-spacing="4">ALINE PEÑA COLUNGA / IDENTIDAD PERSONAL</text><text x="70" y="205" fill="#1a1230" font-size="110" font-weight="700">AP</text><text x="72" y="255" fill="#6e6576" font-size="20" letter-spacing="3">DISEÑO GRÁFICO · DIGITAL · UX/UI</text><path d="M72 298h360" stroke="#decfe0" stroke-width="2"/><text x="72" y="365" fill="#1a1230" font-size="25" font-weight="700">Un sistema visual para ideas claras.</text><text x="72" y="405" fill="#6e6576" font-size="18">Estrategia, estructura y producción para</text><text x="72" y="432" fill="#6e6576" font-size="18">marca, web y marketing.</text><g transform="translate(610 95)"><rect width="500" height="310" fill="#7046ff"/><circle cx="250" cy="150" r="92" fill="none" stroke="#00bfae" stroke-width="8"/><path d="M177 204 250 93l73 111" fill="none" stroke="#ffcb3d" stroke-width="13"/><text x="205" y="166" fill="#fffdfb" font-size="46" font-weight="700">AP</text><text x="163" y="260" fill="#fffdfb" font-size="14" letter-spacing="3">FORMA / FUNCIÓN</text></g><text x="72" y="560" fill="#7046ff" font-family="monospace" font-size="15" letter-spacing="3">PALETA</text><g transform="translate(72 590)"><rect width="90" height="90" fill="#1a1230"/><rect x="105" width="90" height="90" fill="#ff5b70"/><rect x="210" width="90" height="90" fill="#00bfae"/><rect x="315" width="90" height="90" fill="#ffcb3d"/></g><text x="72" y="716" fill="#6e6576" font-size="14">Violeta</text><text x="177" y="716" fill="#6e6576" font-size="14">Coral</text><text x="282" y="716" fill=