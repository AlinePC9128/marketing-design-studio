<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Aline Peña Colunga personal brand board</title>
  <desc id="desc">Editorial brand board showing a monogram, typography, color system and design principles.</desc>
  <rect width="1200" height="900" fill="#f3efe7"/>
  <rect x="0" y="0" width="1200" height="18" fill="#19b9a8"/>
  <g font-family="Arial, sans-serif"><text x="70" y="90" fill="#19b9a8" font-family="monospace" font-size="18" letter-spacing="4">ALINE PEÑA COLUNGA / PERSONAL BRAND</text><text x="70" y="200" fill="#0b1724" font-size="108" font-weight="700">AP</text><text x="72" y="252" fill="#5f6c76" font-size="20" letter-spacing="3">GRAPHIC DESIGN · DIGITAL · UX/UI</text><path d="M72 298h360" stroke="#d0c7b8" stroke-width="2"/>
    <text x="72" y="365" fill="#0b1724" font-size="25" font-weight="700">A visual system built for clarity.</text><text x="72" y="405" fill="#5f6c76" font-size="18">Strategy, structure and production across</text><text x="72" y="432" fill="#5f6c76" font-size="18">brand, web and marketing touchpoints.</text>
    <g transform="translate(610 95)"><rect width="500" height="310" fill="#0b1724"/><circle cx="250" cy="150" r="92" fill="none" stroke="#19b9a8" stroke-width="7"/><path d="M177 204 250 93l73 111" fill="none" stroke="#f5a623" stroke-width="12"/><text x="205" y="166" fill="#fffdf8" font-size="46" font-weight="700">AP</text><text x="162" y="260" fill="#a7c1c4" font-size="14" letter-spacing="3">FORM / FUNCTION</text></g>
    <text x="72" y="560" fill="#19b9a8" font-family="monospace" font-size="15" letter-spacing="3">PALETTE</text><g transform="translate(72 590)"><rect width="90" height="90" fill="#0b1724"/><rect x="105" width="90" height="90" fill="#19b9a8"/><rect x="210" width="90" height="90" fill="#f5a623"/><rect x="315" width="90" height="90" fill="#f3efe7" stroke="#d0c7b8"/></g><text x="72" y="716" fill="#5f6c76" font-size="14">Deep Current</text><text x="177" y="716" fill="#5f6c76" font-size="14">Process Teal</text><text x="282" y="716" fill="#5f6c76" font-size="14">Signal Amber</text><text x="387" y="716" fill="#5f6c76" font-size="14">Warm Sand</text>
    <g transform="translate(650 560)"><text fill="#19b9a8" font-family="monospace" font-size="15" letter-spacing="3">PRINCIPLES</text><text y="55" fill="#0b1724" font-size="22" font-weight="700">01  Structure before decoration</text><text y="98" fill="#0b1724" font-size="22" font-weight="700">02  Evidence before noise</text><text y="141" fill="#0b1724" font-size="22" font-weight="700">03  Systems before one-off assets</text></g>
  </g>
</svg>
