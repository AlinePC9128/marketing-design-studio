<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exploración de identidad aplicada a empaque ORILLA</title>
  <desc id="desc">Lámina conceptual con empaque, etiqueta, bolsa y tarjeta para demostrar una identidad física coherente.</desc>
  <rect width="1200" height="800" fill="#b9c9b1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#35202c"><text x="64" y="72" font-size="13" font-weight="700" letter-spacing="4">03 / IDENTIDAD APLICADA</text><text x="64" y="144" font-size="58" font-weight="700">La marca se vuelve tangible.</text><text x="68" y="181" font-size="16" fill="#756970">Empaque, etiqueta y papelería siguiendo una misma decisión visual.</text></g>
  <g transform="translate(74 294)">
    <path d="M0 78 150 0l150 78-150 78Z" fill="#f6f1eb" stroke="#35202c" stroke-width="4"/><path d="M0 78v190l150 76V156ZM300 78v190l-150 76V156Z" fill="#ffffff" stroke="#35202c" stroke-width="4"/>
    <path d="M66 86a84 84 0 0 0 168 0" fill="none" stroke="#ef674d" stroke-width="13" stroke-linecap="round"/>
    <text x="82" y="142" font-family="Arial, Helvetica, sans-serif" fill="#35202c" font-size="24" font-weight="700" letter-spacing="3">ORILLA</text>
  </g>
  <g transform="translate(490 300)">
    <path d="M0 0h170l-21 252H21Z" fill="#f6f1eb" stroke="#35202c" stroke-width="4"/><path d="M51 0a34 34 0 0 1 68 0" fill="none" stroke="#35202c" stroke-width="4"/>
    <path d="M45 92a40 40 0 0 0 80 0" fill="none" stroke="#ef674d" stroke-width="10" stroke-linecap="round"/><text x="47" y="155" font-family="Arial, Helvetica, sans-serif" fill="#35202c" font-size="17" font-weight="700" letter-spacing="2">ORILLA</text><text x="48" y="180" font-family="Arial, Helvetica, sans-serif" fill="#756970" font-size="10" letter-spacing="2">OBJETO / RITMO</text>
  </g>
  <g transform="translate(760 292)" font-family="Arial, Helvetica, sans-serif" fill="#35202c"><text x="0" y="0" fill="#ef674d" font-size="12" font-weight="700" letter-spacing="3">SISTEMA DE ENTREGA</text><text x="0" y="65" font-size="23" font-weight="700">01 / Etiqueta</text><text x="0" y="94" fill="#756970" font-size="15">Lectura rápida y jerarquía.</text><text x="0" y="160" font-size="23" font-weight="700">02 / Empaque</text><text x="0" y="189" fill="#756970" font-size="15">Volumen, color y repetición.</text><text x="0" y="255" font-size="23" font-weight="700">03 / Papelería</text><text x="0" y="284" fill="#756970" font-size="15">La misma voz en cada punto.</text><rect x="0" y="335" width="310" height="1" fill="#756970"/><text x="0" y="380" font-size="14" font-weight="700">PRODUCCIÓN LISTA PARA ADAPTAR</text></g>
</svg>
