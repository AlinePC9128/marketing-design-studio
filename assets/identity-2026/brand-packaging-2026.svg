<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Aplicación de identidad a empaque</title>
  <desc id="desc">Lámina minimalista con cajas, etiqueta y tarjeta para demostrar cómo una identidad se convierte en sistema físico.</desc>
  <rect width="1200" height="800" fill="#e9f056"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#241b28"><text x="64" y="70" font-size="14" font-weight="700" letter-spacing="4">03 / IDENTIDAD APLICADA</text><text x="64" y="138" font-size="56" font-weight="700">La marca llega al producto.</text><text x="68" y="184" font-size="16" fill="#514a51">Color, etiqueta y forma trabajando como un solo sistema.</text></g>
  <g transform="translate(88 300)"><path d="M0 76 150 0l150 76-150 76Z" fill="#ffffff" stroke="#241b28" stroke-width="4"/><path d="M0 76v190l150 76V152ZM300 76v190l-150 76V152Z" fill="#f6f1eb" stroke="#241b28" stroke-width="4"/><text x="75" y="112" font-family="Arial, Helvetica, sans-serif" fill="#241b28" font-size="24" font-weight="700" transform="rotate(-27 75 112)">NODO</text></g>
  <g transform="translate(560 292)"><rect width="170" height="300" rx="14" fill="#241b28"/><rect x="28" y="35" width="114" height="155" rx="7" fill="#ff765a"/><path d="M54 152 85 82l31 70M68 152l17-39 17 39" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/><text x="46" y="232" font-family="Arial, Helvetica, sans-serif" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="2">NODO</text><text x="37" y="258" font-family="Arial, Helvetica, sans-serif" fill="#b9c9b1" font-size="10" letter-spacing="2">OBJETO / RITMO / USO</text></g>
  <g transform="translate(820 320)" font-family="Arial, Helvetica, sans-serif"><text x="0" y="0" fill="#ef674d" font-size="12" font-weight="700" letter-spacing="3">SISTEMA</text><text x="0" y="55" fill="#241b28" font-size="24" font-weight="700">01 / Etiqueta</text><text x="0" y="86" fill="#514a51" font-size="16">Jerarquía para leer rápido.</text><text x="0" y="152" fill="#241b28" font-size="24" font-weight="700">02 / Empaque</text><text x="0" y="183" fill="#514a51" font-size="16">Volumen, color y repetición.</text><text x="0" y="249" fill="#241b28" font-size="24" font-weight="700">03 / Entrega</text><text x="0" y="280" fill="#514a51" font-size="16">Un sistema listo para producir.</text></g>
  <text x="68" y="738" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#514a51" letter-spacing="2">EXPLORACIÓN CONCEPTUAL · EMPAQUE, ETIQUETA Y PAPELERÍA</text>
</svg>
