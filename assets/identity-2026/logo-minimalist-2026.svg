<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exploración de logo minimalista</title>
  <desc id="desc">Lámina conceptual con un símbolo geométrico, espacio negativo, wordmark y pruebas de escala.</desc>
  <rect width="1200" height="800" fill="#f6f1eb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#35202c"><text x="64" y="70" font-size="14" font-weight="700" letter-spacing="4">01 / LOGO MINIMALISTA</text><text x="64" y="138" font-size="56" font-weight="700">Menos elementos.</text><text x="64" y="194" font-size="56" font-weight="700">Más reconocimiento.</text><text x="68" y="232" font-size="16" fill="#756970">Símbolo, espacio negativo y una regla clara de reproducción.</text></g>
  <rect x="66" y="302" width="470" height="360" fill="#35202c"/>
  <g transform="translate(170 382)" fill="none" stroke="#f6f1eb" stroke-width="18" stroke-linecap="round"><path d="M0 176 108 0l108 176"/><path d="M52 176 108 84l56 92"/></g>
  <text x="170" y="620" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f6f1eb" font-weight="700" letter-spacing="3">NODO</text>
  <g transform="translate(618 318)" font-family="Arial, Helvetica, sans-serif"><text x="0" y="0" fill="#ef674d" font-size="12" font-weight="700" letter-spacing="3">CRITERIOS</text><text x="0" y="56" fill="#35202c" font-size="24" font-weight="700">01 / Forma reconocible</text><text x="0" y="88" fill="#756970" font-size="16">Un gesto simple para memorizar y repetir.</text><text x="0" y="154" fill="#35202c" font-size="24" font-weight="700">02 / Una tinta</text><text x="0" y="186" fill="#756970" font-size="16">Funciona en sello, favicon y documento.</text><text x="0" y="252" fill="#35202c" font-size="24" font-weight="700">03 / Escala</text><text x="0" y="284" fill="#756970" font-size="16">Se lee en grande y conserva su carácter en pequeño.</text><g transform="translate(0 330)"><circle cx="18" cy="18" r="18" fill="#35202c"/><circle cx="68" cy="18" r="18" fill="#ef674d"/><circle cx="118" cy="18" r="18" fill="#b9c9b1"/><text x="0" y="70" font-size="12" fill="#756970">PLUM / PERSIMÓN / JADE</text></g></g>
  <text x="68" y="738" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#756970" letter-spacing="2">EXPLORACIÓN CONCEPTUAL · CONSTRUCCIÓN Y LEGIBILIDAD</text>
</svg>
