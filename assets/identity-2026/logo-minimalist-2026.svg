<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exploración de logo minimalista LIMEN</title>
  <desc id="desc">Lámina conceptual de un símbolo abierto, una palabra y pruebas de legibilidad.</desc>
  <rect width="1200" height="800" fill="#f6f1eb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#35202c">
    <text x="64" y="72" font-size="13" font-weight="700" letter-spacing="4">01 / LOGO MINIMALISTA</text>
    <text x="64" y="144" font-size="58" font-weight="700">Un gesto reconocible.</text>
    <text x="68" y="181" font-size="16" fill="#756970">La forma se reduce hasta conservar solo lo esencial.</text>
  </g>
  <rect x="64" y="252" width="500" height="390" fill="#35202c"/>
  <g transform="translate(174 333)" fill="none" stroke="#f6f1eb" stroke-width="18" stroke-linecap="round">
    <path d="M190 42a112 112 0 1 0 0 164"/>
    <path d="M190 98h76" stroke="#ef674d"/>
    <circle cx="274" cy="98" r="10" fill="#ef674d" stroke="none"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f6f1eb"><text x="174" y="606" font-size="36" font-weight="700" letter-spacing="5">LIMEN</text><text x="176" y="630" font-size="11" fill="#b9c9b1" letter-spacing="3">IDENTIDAD / OBJETOS / ESPACIO</text></g>
  <g transform="translate(650 280)" font-family="Arial, Helvetica, sans-serif" fill="#35202c">
    <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="3" fill="#ef674d">PRUEBAS DE REPRODUCCIÓN</text>
    <text x="0" y="75" font-size="18" font-weight="700">Una tinta</text><text x="0" y="105" font-size="14" fill="#756970">Reconocible sin color.</text>
    <rect x="0" y="142" width="400" height="1" fill="#ded4d0"/>
    <text x="0" y="198" font-size="18" font-weight="700">Tamaño mínimo</text><text x="0" y="228" font-size="14" fill="#756970">El gesto mantiene su lectura.</text>
    <rect x="0" y="265" width="400" height="1" fill="#ded4d0"/>
    <text x="0" y="320" font-size="18" font-weight="700">Área de seguridad</text><text x="0" y="350" font-size="14" fill="#756970">El espacio también construye marca.</text>
    <g transform="translate(0 390)" fill="none" stroke="#35202c" stroke-width="7"><path d="M0 34a34 34 0 1 0 0 50"/><path d="M108 34a34 34 0 1 0 0 50"/><path d="M216 34a34 34 0 1 0 0 50"/><path d="M324 34a34 34 0 1 0 0 50"/></g>
  </g>
</svg>
