<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Estudio de símbolos y wordmarks minimalistas</title>
  <desc id="desc">Lámina editorial con seis ejercicios conceptuales de símbolo, nombre y sistema visual.</desc>
  <rect width="1200" height="800" fill="#f6f1eb"/>
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#35202c" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#35202c">
    <text x="70" y="84" font-size="13" font-weight="700" letter-spacing="4">ESTUDIO DE IDENTIDAD / 2026</text>
    <text x="70" y="137" font-size="42" font-weight="700" letter-spacing="-1">Símbolo, nombre y sistema.</text>
    <text x="70" y="167" font-size="14" fill="#756970">Seis rutas visuales construidas para probar reconocimiento, proporción y legibilidad.</text>
    <text x="968" y="84" font-size="11" font-weight="700" letter-spacing="2">SÍMBOLO / WORDMARK</text>
  </g>

  <g transform="translate(70 214)">
    <rect width="330" height="220" fill="#35202c"/>
    <text x="24" y="30" fill="#b9c9b1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">01 / RITMO</text>
    <g transform="translate(54 62)" fill="none" stroke="#f6f1eb" stroke-width="10" stroke-linecap="round">
      <path d="M0 78 C28 0 106 0 134 78"/>
      <path d="M24 78 C46 25 88 25 110 78" stroke="#ef674d"/>
    </g>
    <text x="205" y="118" fill="#f6f1eb" font-family="Georgia, serif" font-size="31">ritmo</text>
    <text x="205" y="143" fill="#b9c9b1" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">ESTUDIO DE OBJETOS</text>
    <text x="24" y="196" fill="#d8cdd0" font-family="Arial, Helvetica, sans-serif" font-size="11">arco · pausa · repetición</text>
  </g>

  <g transform="translate(435 214)">
    <rect width="330" height="220" fill="#d8e4ff"/>
    <text x="24" y="30" fill="#35202c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">02 / NÚCLEO</text>
    <g transform="translate(50 62)" fill="none" stroke="#35202c" stroke-width="10" stroke-linecap="round">
      <circle cx="64" cy="64" r="52"/>
      <path d="M64 12v104M12 64h104" stroke="#ef674d" stroke-width="7"/>
    </g>
    <text x="192" y="118" fill="#35202c" font-family="Georgia, serif" font-size="31">núcleo</text>
    <text x="192" y="143" fill="#756970" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">OBJETOS COTIDIANOS</text>
    <text x="24" y="196" fill="#756970" font-family="Arial, Helvetica, sans-serif" font-size="11">centro · cruce · orientación</text>
  </g>

  <g transform="translate(800 214)">
    <rect width="330" height="220" fill="#b9c9b1"/>
    <text x="24" y="30" fill="#35202c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">03 / LATIDO</text>
    <g transform="translate(48 68)" fill="none" stroke="#35202c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 60h28l18-40 25 80 18-40h42"/>
      <circle cx="131" cy="60" r="8" fill="#ef674d" stroke="none"/>
    </g>
    <text x="193" y="118" fill="#35202c" font-family="Georgia, serif" font-size="31">latido</text>
    <text x="193" y="143" fill="#756970" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">SALUD Y MOVIMIENTO</text>
    <text x="24" y="196" fill="#756970" font-family="Arial, Helvetica, sans-serif" font-size="11">señal · energía · continuidad</text>
  </g>

  <g transform="translate(70 463)">
    <rect width="330" height="220" fill="#ffffff" stroke="#ded4d0"/>
    <text x="24" y="30" fill="#35202c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">04 / PLIEGUE</text>
    <g transform="translate(54 67)" fill="none" stroke="#35202c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 20 52 72 104 20"/>
      <path d="M26 20 52 46 78 20" stroke="#ef674d"/>
    </g>
    <text x="199" y="118" fill="#35202c" font-family="Georgia, serif" font-size="31">pliegue</text>
    <text x="199" y="143" fill="#756970" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">TALLER EDITORIAL</text>
    <text x="24" y="196" fill="#756970" font-family="Arial, Helvetica, sans-serif" font-size="11">doblez · contraste · ritmo</text>
  </g>

  <g transform="translate(435 463)">
    <rect width="330" height="220" fill="#ef674d"/>
    <text x="24" y="30" fill="#35202c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">05 / UMBRAL</text>
    <g transform="translate(52 60)" fill="none" stroke="#f6f1eb" stroke-width="10" stroke-linecap="round">
      <path d="M0 104V35a52 52 0 0 1 104 0v69"/>
      <path d="M35 104V39a17 17 0 0 1 34 0v65" stroke="#35202c"/>
    </g>
    <text x="195" y="118" fill="#f6f1eb" font-family="Georgia, serif" font-size="31">umbral</text>
    <text x="195" y="143" fill="#35202c" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">ESPACIOS ABIERTOS</text>
    <text x="24" y="196" fill="#f6ded7" font-family="Arial, Helvetica, sans-serif" font-size="11">entrada · pausa · encuentro</text>
  </g>

  <g transform="translate(800 463)">
    <rect width="330" height="220" fill="#35202c"/>
    <text x="24" y="30" fill="#b9c9b1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">06 / TRAMA</text>
    <g transform="translate(55 65)" fill="none" stroke="#f6f1eb" stroke-width="8" stroke-linecap="round">
      <path d="M0 74 38 12l38 62 38-62 38 62"/>
      <path d="M0 104 38 42l38 62 38-62 38 62" stroke="#ef674d"/>
    </g>
    <text x="205" y="118" fill="#f6f1eb" font-family="Georgia, serif" font-size="31">trama</text>
    <text x="205" y="143" fill="#b9c9b1" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">COMUNIDAD Y RED</text>
    <text x="24" y="196" fill="#d8cdd0" font-family="Arial, Helvetica, sans-serif" font-size="11">módulo · vínculo · repetición</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#756970">
    <text x="70" y="725" font-size="11" font-weight="700" letter-spacing="2">EJERCICIOS CONCEPTUALES</text>
    <text x="1130" y="725" text-anchor="end" font-size="11">NO SON MARCAS REALES NI TRABAJOS OFICIALES DE CLIENTES</text>
  </g>
</svg>
