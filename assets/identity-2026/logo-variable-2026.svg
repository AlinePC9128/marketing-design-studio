<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exploración de sistema variable ORBITA</title>
  <desc id="desc">Lámina conceptual con un símbolo que cambia de escala y composición según el formato.</desc>
  <rect width="1200" height="800" fill="#35202c"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="64" y="72" fill="#b9c9b1" font-size="13" font-weight="700" letter-spacing="4">02 / SISTEMA VARIABLE</text><text x="64" y="144" fill="#ffffff" font-size="58" font-weight="700">Una estructura, cuatro usos.</text><text x="68" y="181" fill="#d8cdd0" font-size="16">La identidad cambia de comportamiento sin perder su centro.</text></g>
  <g transform="translate(64 270)" font-family="Arial, Helvetica, sans-serif">
    <rect width="240" height="240" fill="#ef674d"/><rect x="272" width="240" height="240" fill="#d8e4ff"/><rect x="544" width="240" height="240" fill="#b9c9b1"/><rect x="816" width="240" height="240" fill="#f6f1eb"/>
    <g fill="none" stroke="#35202c" stroke-width="12" stroke-linecap="round"><circle cx="120" cy="120" r="62"/><path d="M120 58v124M58 120h124"/><circle cx="392" cy="120" r="62"/><path d="M392 58v124M330 120h124"/><circle cx="664" cy="120" r="62"/><path d="M664 58v124M602 120h124"/><circle cx="936" cy="120" r="62"/><path d="M936 58v124M874 120h124"/></g>
    <g fill="#ef674d"><circle cx="120" cy="58" r="9"/><circle cx="454" cy="120" r="9"/><circle cx="664" cy="182" r="9"/><circle cx="874" cy="120" r="9"/></g>
    <g fill="#35202c" font-size="11" font-weight="700" letter-spacing="2"><text x="22" y="280">01 / AVATAR</text><text x="294" y="280">02 / ENCABEZADO</text><text x="566" y="280">03 / SEÑAL</text><text x="838" y="280">04 / PATRÓN</text></g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif"><text x="64" y="666" fill="#ffffff" font-size="30" font-weight="700" letter-spacing="3">ORBITA</text><text x="64" y="700" fill="#b9c9b1" font-size="15">Misma geometría · distintos ritmos · reconocimiento continuo.</text><text x="1100" y="700" text-anchor="end" fill="#ef674d" font-size="12" font-weight="700" letter-spacing="2">SISTEMA FLEXIBLE</text></g>
</svg>
