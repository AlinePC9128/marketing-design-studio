<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exploración de sistema de logo variable</title>
  <desc id="desc">Lámina conceptual con cuatro comportamientos de un mismo símbolo para avatar, encabezado, señal y patrón.</desc>
  <rect width="1200" height="800" fill="#13273d"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="64" y="70" fill="#d7efff" font-size="14" font-weight="700" letter-spacing="4">02 / SISTEMA VARIABLE</text><text x="64" y="138" fill="#ffffff" font-size="56" font-weight="700">Una marca que se adapta.</text><text x="68" y="184" fill="#b8cad9" font-size="16">La estructura se mantiene; el comportamiento cambia según el formato.</text></g>
  <g transform="translate(64 280)" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"><rect width="220" height="220" rx="42" stroke="#5fbe9c"/><path d="M52 165 110 52l58 113M76 165l34-66 34 66"/><path d="M330 165 388 52l58 113M354 165l34-66 34 66"/><path d="M608 165 666 52l58 113M632 165l34-66 34 66"/><path d="M886 165 944 52l58 113M910 165l34-66 34 66"/></g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#b8cad9" font-size="13" font-weight="700" letter-spacing="2"><text x="64" y="546">01 / AVATAR</text><text x="394" y="546">02 / WORDMARK</text><text x="672" y="546">03 / SEÑAL</text><text x="950" y="546">04 / PATRÓN</text></g>
  <g font-family="Arial, Helvetica, sans-serif"><text x="64" y="640" fill="#ffffff" font-size="25" font-weight="700">Reglas compartidas</text><text x="64" y="680" fill="#b8cad9" font-size="16">Misma geometría · distintos ritmos · reconocimiento continuo.</text><rect x="962" y="626" width="78" height="78" fill="#ff765a"/><rect x="1056" y="626" width="78" height="78" fill="#5fbe9c"/><rect x="1150" y="626" width="0" height="0" fill="none"/></g>
</svg>
