<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exploración de identidad dinámica PULSO</title>
  <desc id="desc">Lámina conceptual con cuatro frames que muestran aparición, expansión, cambio y cierre de un símbolo.</desc>
  <rect width="1200" height="800" fill="#f6f1eb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#35202c"><text x="64" y="72" font-size="13" font-weight="700" letter-spacing="4">04 / IDENTIDAD DINÁMICA</text><text x="64" y="144" font-size="58" font-weight="700">Una idea en movimiento.</text><text x="68" y="181" font-size="16" fill="#756970">La animación cambia el ritmo, no la identidad.</text></g>
  <g transform="translate(64 270)" stroke="#35202c" stroke-width="3"><rect width="250" height="250" fill="#ffffff"/><rect x="286" width="250" height="250" fill="#d8e4ff"/><rect x="572" width="250" height="250" fill="#ef674d"/><rect x="858" width="250" height="250" fill="#35202c" stroke="none"/></g>
  <g fill="none" stroke="#35202c" stroke-width="13" stroke-linecap="round"><path d="M136 438a53 53 0 0 1 106 0"/><path d="M382 438a53 53 0 0 1 106 0M408 438a27 27 0 0 1 54 0"/><path d="M672 438a53 53 0 0 1 106 0M725 385v106"/></g><path d="M946 438h106M999 385v106" fill="none" stroke="#ef674d" stroke-width="13" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2"><text x="82" y="565" fill="#756970">01 / APARECE</text><text x="368" y="565" fill="#756970">02 / RESPIRA</text><text x="654" y="565" fill="#756970">03 / CAMBIA</text><text x="940" y="565" fill="#756970">04 / CIERRA</text></g>
  <g font-family="Arial, Helvetica, sans-serif"><text x="64" y="654" fill="#35202c" font-size="30" font-weight="700" letter-spacing="3">PULSO</text><text x="64" y="690" fill="#756970" font-size="15">Storyboard para redes, presentación, pantalla y microinteracción.</text><rect x="930" y="640" width="44" height="44" fill="#35202c"/><rect x="984" y="640" width="44" height="44" fill="#ef674d"/><rect x="1038" y="640" width="44" height="44" fill="#b9c9b1"/></g>
</svg>
