<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">Publicación de sustentabilidad</title><desc id="desc">Pieza editorial con tres principios medibles de responsabilidad.</desc><rect width="1080" height="1080" fill="#fff4de"/><circle cx="835" cy="195" r="180" fill="#00bfae"/><circle cx="835" cy="195" r="118" fill="#fff4de"/><path d="M-20 810c200-90 270-380 505-380 200 0 280 210 625 40" fill="none" stroke="#7046ff" stroke-width="18"/><g font-family="Arial,sans-serif"><text x="78" y="92" fill="#7046ff" font-family="monospace" font-size="20" letter-spacing="4">RESPONSABILIDAD / OPERACIÓN</text><text x="78" y="230" fill="#1a1230" font-size="72" font-weight="700">Operar hoy</text><text x="78" y="310" fill="#1a1230" font-size="72" font-weight="700">pensando en</text><text x="78" y="390" fill="#ff5b70" font-size="72" font-weight="700">lo que sigue.</text><text x="78" y="470" fill="#6e6576" font-size="23">La responsabilidad se vuelve fuerte</text><text x="78" y="505" fill="#6e6576" font-size="23">cuando aparece en decisiones visibles.</text><g transform="translate(78 650)"><rect width="270" height="160" fill="#1a1230"/><text x="24" y="49" fill="#ffcb3d" font-size="15">01</text><text x="24" y="91" fill="#fffdfb" font-size="25" font-weight="700">MEDIR</text><text x="24" y="128" fill="#e5d9ef" font-size="16">Indicadores, no slogans.</text></g><g transform="translate(374 650)"><rect width="270" height="160" fill="#00bfae"/><text x="24" y="49" fill="#1a1230" font-size="15">02</text><text x="24" y="91" fill="#1a1230" font-size="25" font-weight="700">CUIDAR</text><text x="24" y="128" fill="#1a1230" font-size="16">Personas, energía y entorno.</text></g><g transform="translate(670 650)"><rect width="270" height="160" fill="#ffcb3d"/><text x="24" y="49" fill="#1a1230" font-size="15">03</text><text x="24" y="91" fill="#1a1230" font-size="25" font-weight="700">MEJORAR</text><text x="24" y="128" fill="#1a1230" font-size="16">Aprendizaje continuo.</text></g></g><text x="78" y="955" fill="#1a1230" font-size="25" font-weight="700">Una responsabilidad que también se comunica.</text></svg>
