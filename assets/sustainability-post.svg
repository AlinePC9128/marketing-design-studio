<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Sustainability post: operar hoy pensando en lo que sigue</title>
  <desc id="desc">Pieza editorial cuadrada con una línea de flujo y tres compromisos de sustentabilidad.</desc>
  <rect width="1080" height="1080" fill="#e9e1d2"/><circle cx="835" cy="195" r="180" fill="#1fb7a6"/><circle cx="835" cy="195" r="118" fill="#e9e1d2"/>
  <path d="M-20 810C180 720 250 430 485 430c200 0 280 210 625 40" fill="none" stroke="#0b1724" stroke-width="18"/><path d="M-20 850C180 760 250 470 485 470c200 0 280 210 625 40" fill="none" stroke="#1fb7a6" stroke-width="6"/>
  <g font-family="Arial, sans-serif"><text x="78" y="92" fill="#1fb7a6" font-size="20" letter-spacing="4">COASTOIL / RESPONSIBILITY</text><text x="78" y="230" fill="#0b1724" font-size="72" font-weight="700">Operar hoy</text><text x="78" y="310" fill="#0b1724" font-size="72" font-weight="700">pensando en</text><text x="78" y="390" fill="#f5a623" font-size="72" font-weight="700">lo que sigue.</text><text x="78" y="470" fill="#5f6c76" font-size="23">La sustentabilidad se demuestra</text><text x="78" y="505" fill="#5f6c76" font-size="23">en decisiones operativas visibles.</text>
    <g transform="translate(78 650)"><rect width="270" height="160" fill="#0b1724"/><text x="24" y="49" fill="#f5a623" font-size="15" letter-spacing="2">01</text><text x="24" y="91" fill="#fffdf8" font-size="25" font-weight="700">MEDIR</text><text x="24" y="128" fill="#a7c1c4" font-size="16">Indicadores antes que slogans.</text></g>
    <g transform="translate(374 650)"><rect width="270" height="160" fill="#1fb7a6"/><text x="24" y="49" fill="#0b1724" font-size="15" letter-spacing="2">02</text><text x="24" y="91" fill="#0b1724" font-size="25" font-weight="700">CUIDAR</text><text x="24" y="128" fill="#0b1724" font-size="16">Personas, energía y entorno.</text></g>
    <g transform="translate(670 650)"><rect width="270" height="160" fill="#f5a623"/><text x="24" y="49" fill="#0b1724" font-size="15" letter-spacing="2">03</text><text x="24" y="91" fill="#0b1724" font-size="25" font-weight="700">MEJORAR</text><text x="24" y="128" fill="#0b1724" font-size="16">Aprendizaje continuo.</text></g>
  </g><text x="78" y="955" fill="#0b1724" font-size="25" font-weight="700">Una responsabilidad que también se comunica.</text>
</svg>
