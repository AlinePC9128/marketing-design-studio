<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Evolución de identidad visual de AUTOSISE</title>
  <desc id="desc">Lámina minimalista que explica el paso del logotipo anterior de tres picos al logotipo horizontal actualizado de AUTOSISE y sus reglas de aplicación.</desc>
  <rect width="1400" height="860" fill="#f6f3ef"/>
  <rect width="1400" height="16" fill="#e52f3e"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#09285c">
    <text x="76" y="72" font-size="15" font-weight="700" letter-spacing="4">AUTOSISE / EVOLUCIÓN DE IDENTIDAD</text>
    <text x="76" y="142" font-size="58" font-weight="700" letter-spacing="-2">Del símbolo al sistema.</text>
    <text x="78" y="192" font-size="18" fill="#607087">Una actualización visual para leer mejor la marca en digital, producto y showroom.</text>
  </g>
  <g transform="translate(78 274)">
    <rect width="490" height="280" fill="#ffffff" stroke="#d8d3cd"/>
    <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" fill="#e52f3e" font-size="13" font-weight="700" letter-spacing="3">01 / ANTES</text>
    <g transform="translate(168 90)">
      <path d="M-104 85 0-82 104 85Z" fill="#07357e"/>
      <path d="M-104 85-58-5 0 85Z" fill="#e52f3e"/>
      <path d="M0 85 48-5 104 85Z" fill="#07357e"/>
    </g>
    <text x="32" y="240" font-family="Arial, Helvetica, sans-serif" fill="#09285c" font-size="21" font-weight="700">Símbolo de tres picos</text>
    <text x="32" y="264" font-family="Arial, Helvetica, sans-serif" fill="#607087" font-size="15">Punto de partida de la identidad.</text>
  </g>
  <g transform="translate(594 274)">
    <rect width="728" height="280" fill="#09285c"/>
    <text x="34" y="42" font-family="Arial, Helvetica, sans-serif" fill="#ff6a5a" font-size="13" font-weight="700" letter-spacing="3">02 / DESPUÉS</text>
    <g transform="translate(34 84)">
      <path d="M0 92 42 0l42 92" fill="none" stroke="#e52f3e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 92 42 47l20 45" fill="none" stroke="#e52f3e" stroke-width="11" stroke-linecap="round"/>
      <text x="112" y="73" font-family="Arial, Helvetica, sans-serif" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-2">AUTOSISE</text>
      <text x="114" y="101" font-family="Arial, Helvetica, sans-serif" fill="#ff6a5a" font-size="12" font-weight="700" letter-spacing="2">AUTOMATIZACIÓN Y SISTEMAS DE SEGURIDAD</text>
    </g>
    <text x="34" y="240" font-family="Arial, Helvetica, sans-serif" fill="#ffffff" font-size="21" font-weight="700">Logo horizontal actualizado</text>
    <text x="34" y="264" font-family="Arial, Helvetica, sans-serif" fill="#c7d1df" font-size="15">Más directo para web, comunicación y producto.</text>
  </g>
  <g transform="translate(78 625)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" fill="#e52f3e" font-size="13" font-weight="700" letter-spacing="3">03 / QUÉ CAMBIA</text>
    <g transform="translate(0 28)"><circle cx="12" cy="12" r="5" fill="#e52f3e"/><text x="32" y="18" fill="#09285c" font-size="18" font-weight="700">Lectura horizontal</text><text x="32" y="43" fill="#607087" font-size="15">Nombre y descriptor se entienden en una sola línea.</text></g>
    <g transform="translate(460 28)"><circle cx="12" cy="12" r="5" fill="#e52f3e"/><text x="32" y="18" fill="#09285c" font-size="18" font-weight="700">Escala digital</text><text x="32" y="43" fill="#607087" font-size="15">La marca se adapta a encabezados, tarjetas y redes.</text></g>
    <g transform="translate(900 28)"><circle cx="12" cy="12" r="5" fill="#e52f3e"/><text x="32" y="18" fill="#09285c" font-size="18" font-weight="700">Sistema reconocible</text><text x="32" y="43" fill="#607087" font-size="15">El contraste rojo y azul conserva continuidad visual.</text></g>
  </g>
  <line x1="78" y1="755" x2="1322" y2="755" stroke="#d8d3cd"/>
  <text x="78" y="796" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607087" letter-spacing="1">CASO REAL DE ACTUALIZACIÓN DE IDENTIDAD · REFERENCIAS PROPORCIONADAS POR ALINE PEÑA</text>
</svg>
