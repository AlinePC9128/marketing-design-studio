<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AUTOSISE antes y ahora: fundamentos del rebranding</title>
  <desc id="desc">Caso real de rebranding de AUTOSISE con logo anterior, logo actualizado, paleta de color y correcciones de legibilidad, jerarquía y escala.</desc>
  <rect width="1400" height="900" fill="#ffffff"/>
  <rect width="1400" height="14" fill="#e52f3e"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#09285c">
    <text x="72" y="64" font-size="14" font-weight="700" letter-spacing="4">AUTOSISE / CASO REAL DE REBRANDING</text>
    <text x="72" y="128" font-size="54" font-weight="700" letter-spacing="-2">Antes, ahora y por qué funciona.</text>
    <text x="74" y="170" font-size="17" fill="#607087">Evolución de una identidad profesional para mejorar lectura, jerarquía y adaptación digital.</text>
  </g>

  <g transform="translate(72 222)" font-family="Arial, Helvetica, sans-serif">
    <rect width="570" height="300" rx="4" fill="#ffffff" stroke="#d9dee6" stroke-width="2"/>
    <text x="30" y="42" fill="#e52f3e" font-size="13" font-weight="700" letter-spacing="3">01 / ANTES</text>
    <g transform="translate(285 125)">
      <path d="M-92 80 0-70 92 80Z" fill="#07357e"/>
      <path d="M-92 80-50 0 0 80Z" fill="#e52f3e"/>
      <path d="M0 80 43 0 92 80Z" fill="#07357e"/>
      <text x="-82" y="104" transform="rotate(18)" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#e52f3e" letter-spacing="-1">AUTOSISE</text>
    </g>
    <text x="30" y="260" fill="#09285c" font-size="20" font-weight="700">Logo anterior de tres picos</text>
    <text x="30" y="284" fill="#607087" font-size="14">Símbolo dominante y lectura inclinada.</text>
  </g>

  <g transform="translate(674 222)" font-family="Arial, Helvetica, sans-serif">
    <rect width="654" height="300" rx="4" fill="#ffffff" stroke="#09285c" stroke-width="3"/>
    <text x="30" y="42" fill="#e52f3e" font-size="13" font-weight="700" letter-spacing="3">02 / AHORA</text>
    <g transform="translate(62 88)">
      <path d="M0 105 42 12l42 93" fill="none" stroke="#e52f3e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 105 42 60l20 45" fill="none" stroke="#e52f3e" stroke-width="11" stroke-linecap="round"/>
      <text x="112" y="80" font-family="Arial, Helvetica, sans-serif" fill="#09285c" font-size="54" font-weight="700" letter-spacing="-2">Autosise</text>
      <text x="114" y="108" font-family="Arial, Helvetica, sans-serif" fill="#e52f3e" font-size="12" font-weight="700" letter-spacing="2">AUTOMATIZACIÓN Y SISTEMAS DE SEGURIDAD</text>
    </g>
    <text x="30" y="260" fill="#09285c" font-size="20" font-weight="700">Logo horizontal actualizado</text>
    <text x="30" y="284" fill="#607087" font-size="14">Nombre, símbolo y descriptor con una jerarquía más clara.</text>
  </g>

  <g transform="translate(72 566)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" fill="#e52f3e" font-size="13" font-weight="700" letter-spacing="3">03 / FUNDAMENTOS Y CORRECCIONES</text>
    <g transform="translate(0 34)">
      <circle cx="9" cy="9" r="5" fill="#e52f3e"/><text x="28" y="15" fill="#09285c" font-size="17" font-weight="700">Lectura horizontal</text><text x="28" y="38" fill="#607087" font-size="14">El nombre y el descriptor se leen juntos en encabezados y piezas digitales.</text>
      <circle cx="9" cy="78" r="5" fill="#e52f3e"/><text x="28" y="84" fill="#09285c" font-size="17" font-weight="700">Jerarquía visual</text><text x="28" y="107" fill="#607087" font-size="14">El símbolo acompaña al nombre; el descriptor informa sin competir.</text>
      <circle cx="9" cy="147" r="5" fill="#e52f3e"/><text x="28" y="153" fill="#09285c" font-size="17" font-weight="700">Escala y área segura</text><text x="28" y="176" fill="#607087" font-size="14">La versión horizontal se adapta a web, producto, redes y showroom.</text>
    </g>
  </g>

  <g transform="translate(890 566)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" fill="#e52f3e" font-size="13" font-weight="700" letter-spacing="3">04 / PALETA UTILIZADA</text>
    <rect x="0" y="32" width="74" height="74" fill="#e52f3e"/><rect x="88" y="32" width="74" height="74" fill="#09285c"/><rect x="176" y="32" width="74" height="74" fill="#ffffff" stroke="#d9dee6" stroke-width="2"/><rect x="264" y="32" width="74" height="74" fill="#f2f4f7" stroke="#d9dee6" stroke-width="2"/>
    <text x="0" y="130" fill="#09285c" font-size="12" font-weight="700">#E52F3E</text><text x="88" y="130" fill="#09285c" font-size="12" font-weight="700">#09285C</text><text x="176" y="130" fill="#09285c" font-size="12" font-weight="700">#FFFFFF</text><text x="264" y="130" fill="#09285c" font-size="12" font-weight="700">#F2F4F7</text>
    <text x="0" y="174" fill="#607087" font-size="14">Rojo: energía y acción · Azul: confianza y tecnología</text><text x="0" y="198" fill="#607087" font-size="14">Blanco y gris claro: contraste, limpieza y espacio.</text>
  </g>
  <line x1="72" y1="842" x2="1328" y2="842" stroke="#d9dee6"/>
  <text x="72" y="872" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#607087" letter-spacing="1">CASO REAL · REFERENCIAS PROPORCIONADAS POR ALINE PEÑA COLUNGA · ANTES → AHORA → SISTEMA</text>
</svg>
