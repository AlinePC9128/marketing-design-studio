<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Social content adaptation system</title>
  <desc id="desc">A content production board showing square, portrait, story and email adaptations from one campaign idea.</desc>
  <rect width="1200" height="900" fill="#0b1724"/><path d="M0 740c220-160 290-420 540-340s350 130 660-110v610H0Z" fill="#123441"/>
  <g font-family="Arial,sans-serif"><text x="70" y="80" fill="#1fb7a6" font-family="monospace" font-size="18" letter-spacing="4">CONTENT PRODUCTION / ONE IDEA, MANY FORMATS</text><text x="70" y="180" fill="#fff" font-size="70" font-weight="700">Build once.</text><text x="70" y="255" fill="#f5a623" font-size="70" font-weight="700">Adapt with intent.</text><text x="72" y="308" fill="#a7c1c4" font-size="20">A practical system for social, email and campaign variations.</text>
    <g transform="translate(72 420)"><rect width="230" height="230" fill="#1fb7a6"/><text x="25" y="42" fill="#0b1724" font-family="monospace" font-size="14">01 / SQUARE</text><text x="25" y="120" fill="#0b1724" font-size="32" font-weight="700">THE IDEA</text><rect x="25" y="156" width="120" height="10" fill="#f5a623"/></g>
    <g transform="translate(332 420)"><rect width="190" height="300" fill="#f5a623"/><text x="24" y="42" fill="#0b1724" font-family="monospace" font-size="14">02 / PORTRAIT</text><text x="24" y="125" fill="#0b1724" font-size="28" font-weight="700">THE</text><text x="24" y="158" fill="#0b1724" font-size="28" font-weight="700">PROOF</text><rect x="24" y="202" width="110" height="10" fill="#0b1724"/></g>
    <g transform="translate(552 420)"><rect width="170" height="300" fill="#f4f0e8"/><text x="20" y="42" fill="#0b1724" font-family="monospace" font-size="14">03 / STORY</text><circle cx="85" cy="145" r="54" fill="#1fb7a6"/><text x="56" y="153" fill="#0b1724" font-size="21" font-weight="700">CTA</text><rect x="20" y="240" width="90" height="8" fill="#f5a623"/></g>
    <g transform="translate(752 420)"><rect width="360" height="230" fill="#fffdf8"/><text x="25" y="42" fill="#0b1724" font-family="monospace" font-size="14">04 / EMAIL</text><rect x="25" y="76" width="150" height="13" fill="#0b1724"/><rect x="25" y="108" width="280" height="8" fill="#a7b5b7"/><rect x="25" y="130" width="220" height="8" fill="#a7b5b7"/><rect x="25" y="171" width="105" height="25" rx="12" fill="#1fb7a6"/><text x="54" y="188" fill="#0b1724" font-family="monospace" font-size="10">EXPLORE</text></g>
  </g><text x="72" y="820" fill="#fff" font-size="23" font-weight="700">Consistent layout / channel-ready production / version control</text>
</svg>
