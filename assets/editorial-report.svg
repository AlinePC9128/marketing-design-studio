<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Marketing analytics and creative performance report</title>
  <desc id="desc">Editorial dashboard showing campaign reach, leads, email performance and optimization decisions.</desc>
  <rect width="1200" height="900" fill="#f4f0e8"/>
  <g font-family="Arial,sans-serif"><text x="70" y="80" fill="#1fb7a6" font-family="monospace" font-size="18" letter-spacing="4">CREATIVE PERFORMANCE / REPORTING SYSTEM</text><text x="70" y="180" fill="#0b1724" font-size="70" font-weight="700">Design that</text><text x="70" y="255" fill="#1fb7a6" font-size="70" font-weight="700">learns.</text><text x="72" y="310" fill="#5f6c76" font-size="20">A reporting view that connects creative production</text><text x="72" y="340" fill="#5f6c76" font-size="20">with reach, engagement, leads and next actions.</text>
    <g transform="translate(72 435)"><rect width="310" height="260" fill="#fffdf8" stroke="#d9d4c9"/><text x="26" y="48" fill="#1fb7a6" font-family="monospace" font-size="14">QUALIFIED REACH</text><text x="26" y="120" fill="#0b1724" font-size="58" font-weight="700">+20%</text><path d="M28 215c45-80 80 35 130-52s75 6 125-58" fill="none" stroke="#1fb7a6" stroke-width="8"/><circle cx="283" cy="106" r="9" fill="#f5a623"/></g>
    <g transform="translate(420 435)"><rect width="310" height="260" fill="#0b1724"/><text x="26" y="48" fill="#1fb7a6" font-family="monospace" font-size="14">LEADS / MONTH</text><text x="26" y="120" fill="#fff" font-size="58" font-weight="700">~200</text><rect x="27" y="167" width="225" height="12" fill="#1fb7a6"/><rect x="27" y="191" width="170" height="12" fill="#f5a623"/><rect x="27" y="215" width="126" height="12" fill="#8299a0"/></g>
    <g transform="translate(768 435)"><rect width="340" height="260" fill="#1fb7a6"/><text x="26" y="48" fill="#0b1724" font-family="monospace" font-size="14">EMAIL DATABASE</text><text x="26" y="120" fill="#0b1724" font-size="58" font-weight="700">15K</text><text x="26" y="162" fill="#0b1724" font-size="18">contacts / Mailchimp</text><text x="26" y="218" fill="#0b1724" font-size="20" font-weight="700">~25% opens</text></g>
  </g><text x="72" y="815" fill="#0b1724" font-size="23" font-weight="700">Hypothesis → creative variation → measurement → next decision</text>
</svg>
