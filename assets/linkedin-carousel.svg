<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">Carrusel de LinkedIn: una capacidad, cuatro lecturas</title><desc id="desc">Carrusel editorial con contexto, capacidad, prueba y diálogo.</desc><rect width="1080" height="1080" fill="#1a1230"/><path d="M0 800c220-130 290-420 520-370s330 150 560 40v610H0Z" fill="#7046ff"/><path d="M0 830c250-150 300-390 550-340s340 140 550 30" fill="none" stroke="#00bfae" stroke-width="7"/><g font-family="Arial,sans-serif"><text x="78" y="92" fill="#00bfae" font-family="monospace" font-size="20" letter-spacing="4">LINKEDIN / CARRUSEL</text><text x="78" y="184" fill="#fffdfb" font-size="72" font-weight="700">Una capacidad.</text><text x="78" y="260" fill="#ffcb3d" font-size="72" font-weight="700">Cuatro lecturas.</text><text x="78" y="320" fill="#e5d9ef" font-size="23">Una secuencia para explicar sin abrumar.</text><g transform="translate(78 420)"><rect width="210" height="315" fill="#fff1e8"/><rect x="20" y="20" width="170" height="12" fill="#ff5b70"/><text x="20" y="80" fill="#1a1230" font-size="24" font-weight="700">01</text><text x="20" y="126" fill="#1a1230" font-size="31" font-weight="700">CONTEXTO</text><text x="20" y="176" fill="#6e6576" font-size="17">Lo que</text><text x="20" y="202" fill="#6e6576" font-size="17">debe</text><text x="20" y="228" fill="#6e6576" font-size="17">entenderse.</text><path d="M20 270h126" stroke="#ffcb3d" stroke-width="7"/></g><g transform="translate(314 420)"><rect width="210" height="315" fill="#00bfae"/><text x="20" y="80" fill="#1a1230" font-size="24" font-weight="700">02</text><text x="20" y="126" fill="#1a1230" font-size="31" font-weight="700">CAPACIDAD</text><text x="20" y="176" fill="#1a1230" font-size="17">Lo que</text><text x="20" y="202" fill="#1a1230" font-size="17">puede</text><text x="20" y="228" fill="#1a1230" font-size="17">hacer.</text></g><g transform="translate(550 420)"><rect width="210" height="315" fill="#ffcb3d"/><text x="20" y="80" fill="#1a1230" font-size="24" font-weight="700">03</text><text x="20" y="126" fill="#1a1230" font-size="31" font-weight="700">PRUEBA</text><text x="20" y="176" fill="#1a1230" font-size="17">El dato</text><text x="20" y="202" fill="#1a1230" font-size="17">que sostiene</text><text x="20" y="228" fill="#1a1230" font-size="17">la promesa.</text></g><g transform="translate(786 420)"><rect width="210" height="315" fill="#fffdfb"/><text x="20" y="80" fill="#1a1230" font-size="24" font-weight="700">04</text><text x="20" y="126" fill="#1a1230" font-size="31" font-weight="700">DIÁLOGO</text><text x="20" y="176" fill="#6e6576" font-size="17">Lo que</text><text x="20" y="202" fill="#6e6576" font-size="17">sigue</text><text x="20" y="228" fill="#6e6576" font-size="17">después.</text></g><text x="78" y="940" fill="#fffdfb" font-size="26" font-weight="700">Guarda la idea. Comparte la prueba.</text></g></svg>
