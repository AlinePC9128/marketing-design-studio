<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">LinkedIn carousel: one capability, four readings</title><desc id="desc">Editorial carousel with context, capability, proof and dialogue.</desc><rect width="1080" height="1080" fill="#0b1724"/><path d="M0 800c220-130 290-420 520-370s330 150 560 40v610H0Z" fill="#123441"/><path d="M0 830c250-150 300-390 550-340s340 140 550 30" fill="none" stroke="#1fb7a6" stroke-width="7"/><g font-family="Arial,sans-serif"><text x="78" y="92" fill="#1fb7a6" font-family="monospace" font-size="20" letter-spacing="4">LINKEDIN / CAROUSEL</text><text x="78" y="184" fill="#fffdf8" font-size="72" font-weight="700">One capability.</text><text x="78" y="260" fill="#f5a623" font-size="72" font-weight="700">Four readings.</text><text x="78" y="320" fill="#a7c1c4" font-size="23">A sequence designed to explain without overwhelming.</text><g transform="translate(78 420)"><rect width="210" height="315" fill="#f4f0e8"/><rect x="20" y="20" width="170" height="12" fill="#1fb7a6"/><text x="20" y="80" fill="#0b1724" font-size="24" font-weight="700">01</text><text x="20" y="126" fill="#0b1724" font-size="31" font-weight="700">CONTEXT</text><text x="20" y="176" fill="#5f6c76" font-size="17">What needs</text><text x="20" y="202" fill="#5f6c76" font-size="17">to be</text><text x="20" y="228" fill="#5f6c76" font-size="17">understood.</text><path d="M20 270h126" stroke="#f5a623" stroke-width="7"/></g><g transform="translate(314 420)"><rect width="210" height="315" fill="#1fb7a6"/><rect x="20" y="20" width="170" height="12" fill="#0b1724"/><text x="20" y="80" fill="#0b1724" font-size="24" font-weight="700">02</text><text x="20" y="126" fill="#0b1724" font-size="31" font-weight="700">CAPABILITY</text><text x="20" y="176" fill="#0b1724" font-size="17">What the</text><text x="20" y="202" fill="#0b1724" font-size="17">system</text><text x="20" y="228" fill="#0b1724" font-size="17">can do.</text><path d="M20 270h126" stroke="#f5a623" stroke-width="7"/></g><g transform="translate(550 420)"><rect width="210" height="315" fill="#f5a623"/><rect x="20" y="20" width="170" height="12" fill="#0b1724"/><text x="20" y="80" fill="#0b1724" font-size="24" font-weight="700">03</text><text x="20" y="126" fill="#0b1724" font-size="31" font-weight="700">PROOF</text><text x="20" y="176" fill="#0b1724" font-size="17">Which data</text><text x="20" y="202" fill="#0b1724" font-size="17">supports</text><text x="20" y="228" fill="#0b1724" font-size="17">the promise.</text><path d="M20 270h126" stroke="#1fb7a6" stroke-width="7"/></g><g transform="translate(786 420)"><rect width="210" height="315" fill="#fffdf8"/><rect x="20" y="20" width="170" height="12" fill="#f5a623"/><text x="20" y="80" fill="#0b1724" font-size="24" font-weight="700">04</text><text x="20" y="126" fill="#0b1724" font-size="31" font-weight="700">DIALOGUE</text><text x="20" y="176" fill="#5f6c76" font-size="17">What happens</text><text x="20" y="202" fill="#5f6c76" font-size="17">after the</text><text x="20" y="228" fill="#5f6c76" font-size="17">read.</text><path d="M20 270h126" stroke="#1fb7a6" stroke-width="7"/></g><text x="78" y="940" fill="#fffdf8" font-size="26" font-weight="700">Save the idea. Share the proof.</text></g></svg>
